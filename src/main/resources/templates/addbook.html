<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lisää arkistomerkintä</title>
</head>
<body>

    <h1>Lisää arkistomerkintä</h1>

    <form th:object="${book}" th:action="@{/tallenna}" method="post">
        <p>
            Huone:
            <input type="text" th:field="*{huone}" />
            <span th:if="${#fields.hasErrors('huone')}"
            th:errors="*{huone}"></span>
        </p>

        <p>
            Hylly:
            <input type="text" th:field="*{hylly}" />
        </p>

        <p>
            Rivi:
            <input type="text" th:field="*{rivi}" />
        </p>

        <p>
            Mappien määrä:
            <input type="number" th:field="*{mappienMaara}" />
            <span th:if="${#fields.hasErrors('mappienMaara')}"
            th:errors="*{mappienMaara}"></span>
        </p>

        <p>
            Yritys:
            <select th:field="*{yritys}">
                <option th:each="yritys : ${categories}"
                        th:value="${yritys.id}"
                        th:text="${yritys.name}">
                </option>
            </select>
        </p>

        <input type="submit" value="Tallenna" />
    </form>

</body>
</html>
