<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Muokkaa arkistomerkintää</title>
</head>
<body>

    <h1>Muokkaa arkistomerkintää</h1>

    <form th:object="${book}" th:action="@{/tallenna}" method="post">

        <input type="hidden" th:field="*{id}" />

        <p>
            Huone:
            <input type="text" th:field="*{huone}" />
        </p>

        <p>
            Hylly:
            <input type="text" th:field="*{hylly}" />
        </p>

        <p>
            Rivi:
            <input type="text" th:field="*{rivi}" />
        </p>

        <p>
            Mappien määrä:
            <input type="number" th:field="*{mappienMaara}" />
        </p>

        <p>
            Yritys:
            <select th:field="*{yritys}">
                <option th:each="yritys : ${categories}"
                        th:value="${yritys.id}"
                        th:text="${yritys.name}">
                </option>
            </select>
        </p>

        <input type="submit" value="Tallenna muutokset" />

    </form>

</body>
</html>
