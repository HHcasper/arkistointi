<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Arkistolista</title>
</head>
<body>

    <h1>Arkistomerkinnät</h1>

    <p sec:authorize="isAuthenticated()">
        Kirjautunut käyttäjä: <strong sec:authentication="name"></strong>
    </p>
    
    <form sec:authorize="isAuthenticated()"
          th:action="@{/logout}" method="post">
        <button type="submit">Kirjaudu ulos</button>
    </form>
    
    <a sec:authorize="isAnonymous()" th:href="@{/login}">
        Kirjaudu sisään
    </a>

    <br>

    <table>
        <thead>
            <tr>
                <th>Huone</th>
                <th>Hylly</th>
                <th>Rivi</th>
                <th>Mappien määrä</th>
                <th>Yritys</th>
                <th></th>
                <th></th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.huone}"></td>
                <td th:text="${book.hylly}"></td>
                <td th:text="${book.rivi}"></td>
                <td th:text="${book.mappienMaara}"></td>
                <td th:text="${book.yritys != null ? book.yritys.name : '-'}"></td>
                <td sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/delete/{id}(id=${book.id})}">Delete</a>
                </td>
                <td sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/edit/{id}(id=${book.id})}">Edit</a>
                </td>
            </tr>
        </tbody>
    </table>

    <br>

    <a sec:authorize="hasRole('ADMIN')"
   th:href="@{/lisaa}">Lisää arkistomerkintä</a>

</body>
</html>
